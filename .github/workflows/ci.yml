name: ci
on:
  pull_request:
  push:
    branches: main
    tags:
      - '*'

jobs:
  # flake8 linting
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run flake8
        run: |
          pip install flake8
          flake8
  # check manifest/sources consistency
  check-manifest:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: pip install check-manifest
    - name: Check MANIFEST
      run: check-manifest
  # unit tests
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash -l {0}
    strategy:
      fail-fast: false
      matrix:
        mpi_install: [system, conda]
        python: ['3.10', '3.12', '3.13']
    env:
      DICODILE_DATA_HOME: /home/runner/data
      # mpi_workers reads MPI_HOSTFILE at import, before the update_z conftest
      # can set it, so it has to come from the environment.
      MPI_HOSTFILE: hostfile
      # The runner has fewer cores than the tests ask workers for. Yield
      # instead of spinning, or oversubscribed ranks starve each other.
      OMPI_MCA_mpi_yield_when_idle: 1
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: ${{ matrix.python }}
          channels: conda-forge
      - name: Cache test data
        uses: actions/cache@v4
        env:
          cache-name: cache-test-data
        with:
          path: ${{ env.DICODILE_DATA_HOME }}
          key: ${{ env.cache-name }}
      - name: Install MPI
        run: |
          conda --version
          which python
          ./ci/install_mpi.sh
        env:
          MPI_INSTALL: ${{ matrix.mpi_install }}
      - name: Run unit tests
        run: |
          pip install -e .[test]
          echo "localhost slots=16">hostfile
          export OMPI_MCA_btl_tcp_if_exclude="docker0"
          pytest --cov-report=xml --cov=dicodile
      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: unittests
          fail_ci_if_error: false
          verbose: true
  # build and publish to PyPI and TestPyPi
  build-n-publish:
    name: Build and publish Python 🐍 distributions 📦 to PyPI and TestPyPI
    runs-on: ubuntu-latest
    needs: [lint, test, check-manifest]
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install pypa/build
      run: >-
        python -m
        pip install
        build
        --user
    - name: Build a binary wheel and a source tarball
      run: >-
        python -m
        build
        --sdist
        --wheel
        --outdir dist/
    - name: Publish distribution 📦 to Test PyPI
      if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags')) && github.repository == 'tomMoral/dicodile'
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        password: ${{ secrets.TEST_PYPI_API_TOKEN }}
        repository-url: https://test.pypi.org/legacy/
        # do not fail if the TestPyPi release already
        # exists
        skip-existing: true
    - name: Publish distribution 📦 to PyPI
      if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags') && github.repository == 'tomMoral/dicodile'
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        password: ${{ secrets.PYPI_API_TOKEN }}
