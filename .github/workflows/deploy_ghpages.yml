name: Deploy GitHub pages

on:
  pull_request:
  push:
    branches: main


jobs:
  build_docs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OMPI_MCA_mpi_yield_when_idle: 1
    steps:
      # setuptools_scm needs the full history to derive the version
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dicodile
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenmpi-dev openmpi-bin
          python -m pip install --upgrade pip
          python -m pip install -e .[doc]
      - name: Generate HTML docs
        run: |
          echo "localhost slots=50">hostfile
          make -C docs html
      - name:  Upload generated HTML as artifact
        uses: actions/upload-artifact@v4
        with:
          name: DocHTML
          path: docs/_build/html/

  deploy_docs:
    if: github.ref == 'refs/heads/main'
    needs:
      build_docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: DocHTML
          path: docs/_build/html/
      - name: Commit to documentation branch
        run: |
          git clone --no-checkout --depth 1 https://github.com/${{ github.repository_owner }}/dicodile.git --branch gh-pages --single-branch gh-pages
          cp -r docs/_build/html/* gh-pages/
          cd gh-pages
          touch .nojekyll
          git config --local user.email "dicodile@github.com"
          git config --local user.name "dicodile GitHub Action"
          git add .
          git commit -m "Update documentation" -a || true
      - name: Push changes
        uses: ad-m/github-push-action@v0.8.0
        with:
          branch: gh-pages
          directory: gh-pages
          github_token: ${{ secrets.GITHUB_TOKEN }}

          
